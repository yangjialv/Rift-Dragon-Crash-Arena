[EffectsQuality@0]
; Retain enough Niagara density for warnings and attack readability on the
; integrated-GPU preset without paying the full decorative-particle cost.
; Projectile actors, damage volumes and combat timing are unaffected.
r.EmitterSpawnRateScale=0.3
fx.Niagara.QualityLevel=1

[ViewDistanceQuality@0]
; Prefer existing lower LODs earlier on the integrated-GPU build. Assets that
; do not provide LODs are left unchanged.
r.StaticMeshLODDistanceScale=2.0
r.SkeletalMeshLODBias=1

[PostProcessQuality@0]
r.MotionBlurQuality=0
r.BloomQuality=0
r.DepthOfFieldQuality=0
r.AmbientOcclusionLevels=0
r.LensFlareQuality=0
r.LightShaftQuality=0

[TextureQuality@0]
; Integrated graphics shares system memory. A small mip bias and inexpensive
; filtering reduce bandwidth pressure while keeping warning shapes readable.
r.Streaming.MipBias=1
r.MaxAnisotropy=2

[ShadingQuality@0]
r.MaterialQualityLevel=0

[EffectsQuality@1]
; Preserve attack readability at Medium quality. Other translucency and
; material costs still use UE's Medium defaults, but Niagara does not reduce
; the number of projectiles, laser particles, or phase-transition particles.
r.EmitterSpawnRateScale=1.0
fx.Niagara.QualityLevel=3
